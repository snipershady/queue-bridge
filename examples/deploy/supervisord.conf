; Supervisor program for 4 worker processes on the same queue.
; The worker exits after one hour or 256 MB and Supervisor restarts it; SIGTERM triggers a graceful shutdown.
[program:queue-worker]
command=php /var/www/app/vendor/bin/queue-worker work --queue=messages --bootstrap=/var/www/app/config/queue-handlers.php --max-runtime=3600 --memory-limit=256
environment=QUEUE_DSN="amqp://app:secret@rabbitmq:5672?prefetch=20"
process_name=%(program_name)s_%(process_num)02d
numprocs=4
user=www-data
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
; Longer than the slowest handler.
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/log/queue-worker.log
